[workspace]
members = [
  "src/fakemkbot",
  "src/fakemkbot_collector",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
dotenvy = "0.15.7"
grammers-client = "0.10.0"
grammers-mtsender = "0.10.0"
grammers-session = { version = "0.10.0", features = ["sqlite-storage"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync"] }
